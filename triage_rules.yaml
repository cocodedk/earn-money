# Triage suppression rules.
#
# Findings matching a rule are routed directly to findings/_resolved/info/
# instead of findings/_queue/, with an audit row in findings_state_history
# recording rule, template, version, and reason.
#
# Source: ops/playbook.md "Triage rules of thumb" — info-severity nuclei
# templates that are almost always resolved_na on modern apps.

rules:
  - name: noise.cookies-without-httponly
    vuln_class: cookies-without-httponly
    severity: info
    reason: playbook-noise
  - name: noise.csp-script-src-wildcard
    vuln_class: csp-script-src-wildcard
    severity: info
    reason: playbook-noise
  - name: noise.missing-cookie-samesite-strict
    vuln_class: missing-cookie-samesite-strict
    severity: info
    reason: playbook-noise
  - name: noise.tls-version
    vuln_class: tls-version
    severity: info
    reason: info-no-impact
  # Added 2026-05-14 from engagement-1 cycle 4 (H1/security) — 96+
  # findings of these landed in the queue. None are exploitable on
  # modern hardened apps; XSRF/anti-CSRF + framework defaults handle
  # all the "missing" cases the templates flag.
  - name: noise.http-missing-security-headers
    vuln_class: http-missing-security-headers
    severity: info
    reason: playbook-noise
  - name: noise.missing-sri
    vuln_class: missing-sri
    severity: info
    reason: playbook-noise
  - name: noise.fastly-debug-headers
    vuln_class: fastly-debug-headers
    severity: info
    reason: info-no-impact
  - name: noise.weak-csp-detect
    vuln_class: weak-csp-detect
    severity: info
    reason: playbook-noise
  - name: noise.xss-deprecated-header
    vuln_class: xss-deprecated-header
    severity: info
    reason: info-no-impact
  # Added 2026-05-14 after the algolia cycle 4 noise — nuclei's
  # `credentials-disclosure` template regex-matches any `API_KEY = "..."`
  # literal and fires at severity=unknown when it can't classify the
  # vendor. In practice this is overwhelmingly analytics write keys
  # (Amplitude, Segment, GA measurement IDs, Mixpanel project tokens)
  # that are public by design. A real credential leak — AWS access key,
  # admin API key, JWT signing secret — fires at medium or higher and
  # is *not* suppressed by this rule.
  - name: noise.credentials-disclosure-unknown
    vuln_class: credentials-disclosure
    severity: unknown
    reason: analytics-write-key-public-by-design
