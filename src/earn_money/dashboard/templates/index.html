<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earn-money dashboard</title>
<style>
  :root {
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --border:#2a313c;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950;
    --warn:#d29922; --bad:#f85149; --purple:#a371f7; --gray:#6e7681;
    --lightgray:#484f58; --darkgray:#30363d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.4; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #refresh { font-size: 12px; padding: 4px 10px; border-radius: 12px;
    background: var(--panel2); border: 1px solid var(--border); }
  #refresh.live { color: var(--ok); }
  #refresh.busy { color: var(--muted); }
  #refresh.stale { color: var(--warn); border-color: var(--warn); }
  main { padding: 16px 20px; }
  #across { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; margin-bottom: 20px; }
  #programs { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
  .tile, article.program { background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px; }
  article.program { display: flex; flex-direction: column; gap: 10px; }
  .tile-label, .section-label { color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .tile-label { font-size: 12px; }
  .tile-value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .tile-value.good { color: var(--ok); }
  .tile-value.bad { color: var(--bad); }
  .prog-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .prog-title { font-size: 16px; font-weight: 600; }
  .prog-synced { color: var(--muted); font-size: 12px; margin-left: auto; }
  .policy { font-size: 11px; padding: 2px 8px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }
  .policy.rate-limited-OK { background: #0d3a1d; color: var(--ok); border: 1px solid #1f5132; }
  .policy.manual-only { background: #3a2a0d; color: var(--warn); border: 1px solid #5a4015; }
  .policy.ambiguous { background: #3a0d0d; color: var(--bad); border: 1px solid #5a1515; }
  .frozen-row, .error-row { padding: 8px 10px; border-radius: 4px; font-size: 12px;
    word-break: break-word; }
  .frozen-row { background: #3a0d0d; border: 1px solid var(--bad); color: #ffdada;
    white-space: pre-wrap; }
  .error-row { background: #3a2a0d; border: 1px solid var(--warn); color: #ffe9b3; }
  .state-badges, .runs { display: flex; flex-wrap: wrap; gap: 4px; }
  .state, .run { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .state { background: var(--panel2); color: var(--text); }
  .state.queued { background: #0d2a4a; color: #79b8ff; }
  .state.verified { background: #3a2a0d; color: var(--warn); }
  .state.submitted { background: #2a1a3a; color: var(--purple); }
  .state.resolved_paid { background: #0d3a1d; color: var(--ok); }
  .state.resolved_dupe, .state.resolved_na { background: var(--gray); color: #fff; }
  .state.resolved_info { background: var(--lightgray); color: #fff; }
  .state.archived { background: var(--darkgray); color: var(--muted); }
  table.queue { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.queue th, table.queue td { text-align: left; padding: 4px 6px;
    border-bottom: 1px solid var(--border); vertical-align: top; }
  table.queue th { color: var(--muted); font-weight: 500; }
  table.queue td.hash { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  table.queue td.asset { word-break: break-all; }
  .empty { color: var(--muted); font-style: italic; font-size: 12px; }
  .sev { font-size: 11px; padding: 1px 6px; border-radius: 8px; font-weight: 600;
    text-transform: uppercase; }
  .sev.critical { background: #5a0d0d; color: #ffb3b3; }
  .sev.high { background: var(--bad); color: #fff; }
  .sev.medium { background: #c2410c; color: #fff; }
  .sev.low { background: #a16207; color: #fff; }
  .sev.info { background: var(--lightgray); color: #fff; }
  .sev.unknown { background: var(--gray); color: #fff; }
  .run { background: var(--panel2); border: 1px solid var(--border); }
  .run .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle; }
  .run .dot.success { background: var(--ok); }
  .run .dot.partial { background: #c2410c; }
  .run .dot.failed { background: var(--bad); }
  .run .dot.skipped { background: var(--gray); }
  .run .dot.in_progress { background: var(--accent); }
  footer { padding: 12px 20px; color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--border); margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>earn-money dashboard</h1>
  <span id="refresh" class="busy">↻ loading</span>
</header>
<main>
  <section id="across"></section>
  <section id="programs"></section>
</main>
<footer><span>Last updated: <span id="last-updated">—</span></span></footer>
<script>
"use strict";
const STATE_KEYS = ["queued", "verified", "submitted", "resolved_paid",
  "resolved_dupe", "resolved_na", "resolved_info", "archived"];

function el(tag, opts) {
  const e = document.createElement(tag);
  if (opts && opts.cls) e.className = opts.cls;
  if (opts && opts.text != null) e.textContent = String(opts.text);
  return e;
}

function ageLabel(iso) {
  if (!iso) return "never";
  const ms = Date.now() - Date.parse(iso);
  if (isNaN(ms)) return "—";
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

function fmtTime(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso);
  if (isNaN(t)) return iso;
  const ms = Date.now() - t;
  if (ms < 86400000 && ms >= 0) return ageLabel(iso);
  const d = new Date(t);
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
    + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function renderAcross(across) {
  const root = document.getElementById("across");
  root.replaceChildren();
  const opNote = across.first_verified_with_operator_note;
  const tiles = [
    {label: "Total findings", value: across.total_findings},
    {label: "Queued", value: across.total_queued},
    {label: "Suppression rate", value: across.suppression_rate_pct + "%"},
    {label: "First verified candidate", value: opNote ? "✓" : "✗",
     cls: opNote ? "good" : "bad"},
  ];
  for (const t of tiles) {
    const tile = el("div", {cls: "tile"});
    tile.appendChild(el("div", {cls: "tile-label", text: t.label}));
    tile.appendChild(el("div", {cls: "tile-value " + (t.cls || ""), text: t.value}));
    root.appendChild(tile);
  }
}

function renderProgramHeader(p) {
  const h = el("div", {cls: "prog-header"});
  h.appendChild(el("span", {cls: "prog-title", text: p.platform + "/" + p.slug}));
  if (p.policy) h.appendChild(el("span", {cls: "policy " + p.policy, text: p.policy}));
  h.appendChild(el("span", {cls: "prog-synced", text: "synced " + ageLabel(p.last_synced)}));
  return h;
}

function renderStateBadges(states) {
  const row = el("div", {cls: "state-badges"});
  for (const k of STATE_KEYS) {
    const n = (states || {})[k] || 0;
    if (n <= 0) continue;
    row.appendChild(el("span", {cls: "state " + k, text: k + " " + n}));
  }
  return row;
}

function renderQueueTable(top) {
  if (!top || top.length === 0) return el("div", {cls: "empty", text: "no queued candidates"});
  const table = el("table", {cls: "queue"});
  const thead = el("thead"); const trh = el("tr");
  for (const c of ["hash", "sev", "vuln_class", "asset", "first_seen"]) {
    trh.appendChild(el("th", {text: c}));
  }
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = el("tbody");
  for (const r of top) {
    const tr = el("tr");
    tr.appendChild(el("td", {cls: "hash", text: r.hash}));
    const sevTd = el("td");
    const sevKey = (r.severity || "unknown").toLowerCase();
    sevTd.appendChild(el("span", {cls: "sev " + sevKey, text: r.severity || "unknown"}));
    tr.appendChild(sevTd);
    tr.appendChild(el("td", {text: r.vuln_class || ""}));
    tr.appendChild(el("td", {cls: "asset", text: r.asset || ""}));
    tr.appendChild(el("td", {text: fmtTime(r.first_seen)}));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function renderRunsStrip(runs) {
  if (!runs || runs.length === 0) return el("div", {cls: "empty", text: "no recent runs"});
  const strip = el("div", {cls: "runs"});
  for (const r of runs) {
    const chip = el("span", {cls: "run"});
    chip.appendChild(el("span", {cls: "dot " + (r.status || "unknown")}));
    chip.appendChild(document.createTextNode(
      (r.tool || "?") + " · " + (r.status || "?") + " · " + (r.signal_count || 0) + " signals"
    ));
    strip.appendChild(chip);
  }
  return strip;
}

function renderProgram(p) {
  const card = el("article", {cls: "program"});
  card.appendChild(renderProgramHeader(p));
  if (p.frozen) {
    const fr = el("div", {cls: "frozen-row"});
    fr.appendChild(document.createTextNode("❄ FROZEN — "));
    fr.appendChild(document.createTextNode(p.frozen_reason || "no reason given"));
    card.appendChild(fr);
  }
  if (p.error) {
    const er = el("div", {cls: "error-row"});
    er.appendChild(document.createTextNode("⚠ "));
    er.appendChild(document.createTextNode(p.error));
    card.appendChild(er);
  }
  card.appendChild(renderStateBadges(p.finding_states));
  card.appendChild(el("div", {cls: "section-label", text: "top queue"}));
  card.appendChild(renderQueueTable(p.top_queue));
  card.appendChild(el("div", {cls: "section-label", text: "recent runs"}));
  card.appendChild(renderRunsStrip(p.recent_runs));
  return card;
}

function renderPrograms(programs) {
  const root = document.getElementById("programs");
  root.replaceChildren();
  if (!programs || programs.length === 0) {
    root.appendChild(el("div", {cls: "empty", text: "no programs registered"}));
    return;
  }
  for (const p of programs) root.appendChild(renderProgram(p));
}

function setRefresh(state, ts) {
  const r = document.getElementById("refresh");
  r.className = state;
  if (state === "live") r.textContent = "● live " + ts;
  else if (state === "busy") r.textContent = "↻ refreshing";
  else r.textContent = "⚠ stale";
}

async function tick() {
  setRefresh("busy");
  try {
    const res = await fetch("/api/status", {cache: "no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderAcross(data.across || {});
    renderPrograms(data.programs || []);
    const stamp = new Date().toTimeString().slice(0, 8);
    setRefresh("live", stamp);
    document.getElementById("last-updated").textContent = data.generated_at || stamp;
  } catch (err) {
    setRefresh("stale");
  }
}

tick();
setInterval(tick, 10000);
</script>
</body>
</html>
