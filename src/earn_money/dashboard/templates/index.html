<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earn-money dashboard</title>
<style>
  :root {
    --paper:    #ece6d4;
    --paper-2:  #e3dcc6;
    --ink:      #14110b;
    --ink-2:    #2b2418;
    --mute:     #7a715a;
    --rule:     #b3aa90;
    --frozen:   #a3261b;
    --critical: #b32a1d;
    --high:     #c25627;
    --medium:   #b48315;
    --low:      #6d7e2d;
    --info:     #7a715a;
    --verified: #b6862a;
    --good:     #3f6b3e;
    --bad:      #a3261b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #16140d;
      --paper-2:  #1d1a11;
      --ink:      #ece6d4;
      --ink-2:    #c8c0a4;
      --mute:     #807762;
      --rule:     #3a3527;
      --frozen:   #e25b4f;
      --critical: #e25b4f;
      --high:     #e9874a;
      --medium:   #d6a93e;
      --low:      #9eb16a;
      --info:     #6e6650;
      --verified: #d6a93e;
      --good:     #7aa067;
      --bad:      #e25b4f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper); color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono",
                 Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 14px; line-height: 1.55;
    font-feature-settings: "tnum" 1, "zero" 1;
    text-rendering: geometricPrecision;
  }
  /* Subtle paper grain so the cream doesn't look flat-screen */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.02)  0, transparent 50%);
    mix-blend-mode: multiply;
  }
  main { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto;
         padding: clamp(1.5rem, 4vw, 3rem); }

  /* HEADER ------------------------------------------------------------- */
  header { display: grid; grid-template-columns: 1fr auto;
           gap: 1rem; align-items: end; margin-bottom: 2.5rem; }
  .brand { line-height: 1; }
  .brand .marque {
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    font-weight: 700; letter-spacing: -0.04em;
    color: var(--ink);
  }
  .brand .marque small {
    display: inline-block; font-size: 0.18em; font-weight: 600;
    letter-spacing: 0.25em; vertical-align: top; margin-left: 0.6em;
    margin-top: 0.6em; color: var(--mute);
  }
  .brand .sub {
    margin-top: 0.6em; font-size: 0.78rem; color: var(--mute);
    letter-spacing: 0.06em;
  }
  .live {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.35rem 0.6rem; border: 1px solid var(--rule);
    background: var(--paper-2); font-size: 0.7rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2);
    white-space: nowrap;
  }
  .live .dot {
    width: 0.45rem; height: 0.45rem; border-radius: 50%;
    background: var(--good); box-shadow: 0 0 0 0 var(--good);
    animation: pulse 2.4s ease-out infinite;
  }
  .live.busy .dot  { background: var(--mute); animation: none; }
  .live.stale .dot { background: var(--bad); animation: none; }
  .live.stale      { border-color: var(--bad); color: var(--bad); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 currentColor; }
    70%  { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* SECTION RULES ------------------------------------------------------- */
  .rule {
    display: flex; align-items: baseline; gap: 1rem;
    margin: 2.5rem 0 1.25rem; color: var(--mute);
    font-size: 0.7rem; letter-spacing: 0.32em; text-transform: uppercase;
  }
  .rule::before, .rule::after { content: ""; flex: 1 0 auto;
                                border-top: 1px solid var(--rule); }
  .rule::before { flex: 0 0 1.5rem; }

  /* METRICS ------------------------------------------------------------- */
  #across { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .metric { padding: 1.5rem 1.25rem; border-right: 1px solid var(--rule);
            display: flex; flex-direction: column; gap: 0.5rem;
            position: relative; }
  .metric:last-child { border-right: none; }
  .metric .label { font-size: 0.65rem; letter-spacing: 0.28em;
                   text-transform: uppercase; color: var(--mute); }
  .metric .value { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 700;
                   line-height: 1; letter-spacing: -0.04em; }
  .metric .value.good { color: var(--good); }
  .metric .value.bad  { color: var(--bad); }
  .metric .unit { font-size: 0.55em; font-weight: 500;
                  color: var(--mute); margin-left: 0.25em; }

  /* PROGRAMS ------------------------------------------------------------ */
  #programs { display: grid; gap: 2.25rem; }
  article.program {
    display: grid; grid-template-columns: 1fr; gap: 0.85rem;
    padding: 1.25rem 1.5rem; border: 1px solid var(--rule);
    background: var(--paper-2); position: relative;
  }
  /* hot-stamp number in the top-right corner of each card */
  article.program::after {
    content: attr(data-index); position: absolute; top: 0.65rem; right: 0.85rem;
    font-size: 0.65rem; letter-spacing: 0.22em; color: var(--mute);
    font-weight: 600;
  }
  .prog-head { display: flex; align-items: baseline; flex-wrap: wrap;
               gap: 0.6rem 1rem; }
  .prog-title { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
  .prog-title .slug { color: var(--ink); }
  .prog-title .sep  { color: var(--mute); margin: 0 0.2em; font-weight: 400; }
  .prog-title .platform { color: var(--mute); font-weight: 500; }
  .policy {
    font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 700; padding: 0.25rem 0.55rem;
    border: 1px solid var(--ink);
  }
  .policy.rate-limited-OK { background: var(--paper); color: var(--ink); }
  .policy.manual-only     { background: var(--ink); color: var(--paper); }
  .policy.ambiguous       { background: var(--paper); color: var(--bad);
                            border-color: var(--bad); }
  .prog-synced { margin-left: auto; font-size: 0.72rem; color: var(--mute);
                 letter-spacing: 0.08em; }

  .frozen-row, .error-row {
    border-left: 3px solid var(--bad); padding: 0.5rem 0.85rem;
    background: var(--paper); font-size: 0.78rem; color: var(--bad);
    white-space: pre-wrap; word-break: break-word;
  }
  .error-row { border-color: var(--medium); color: var(--medium); }

  .states { display: flex; flex-wrap: wrap; gap: 0.4rem 0.85rem;
            font-size: 0.72rem; letter-spacing: 0.06em; }
  .states .state { display: inline-flex; align-items: baseline; gap: 0.35rem; }
  .states .state .name {
    text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.16em;
    color: var(--mute);
  }
  .states .state .n   { font-weight: 700; font-size: 0.9rem; }
  .states .state.queued    .n { color: var(--ink); }
  .states .state.verified  .n { color: var(--verified); }
  .states .state.submitted .n { color: var(--high); }
  .states .state.resolved_paid .n { color: var(--good); }
  .states .state.resolved_info .n { color: var(--mute); }

  .qtbl { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .qtbl thead th {
    text-align: left; font-weight: 600; padding: 0.35rem 0.5rem 0.35rem 0;
    border-bottom: 1px solid var(--ink); color: var(--mute);
    text-transform: uppercase; letter-spacing: 0.18em; font-size: 0.6rem;
  }
  .qtbl tbody td {
    padding: 0.4rem 0.5rem 0.4rem 0;
    border-bottom: 1px dotted var(--rule); vertical-align: top;
  }
  .qtbl tbody tr:last-child td { border-bottom: none; }
  .qtbl .hash { font-weight: 600; color: var(--ink); }
  .qtbl .vc   { color: var(--ink); }
  .qtbl .asset { color: var(--mute); }
  .qtbl .ts    { color: var(--mute); white-space: nowrap; font-size: 0.7rem; }
  .empty { color: var(--mute); font-style: italic; font-size: 0.78rem;
           padding: 0.5rem 0; }

  .sev { display: inline-block; font-size: 0.6rem; font-weight: 700;
         text-transform: uppercase; letter-spacing: 0.16em;
         padding: 0.12rem 0.45rem; border: 1px solid currentColor; }
  .sev.critical { color: var(--critical); }
  .sev.high     { color: var(--high); }
  .sev.medium   { color: var(--medium); }
  .sev.low      { color: var(--low); }
  .sev.info     { color: var(--info); }
  .sev.unknown  { color: var(--mute); }

  .runs { display: flex; flex-wrap: wrap; gap: 0.4rem; font-size: 0.7rem;
          color: var(--mute); }
  .run { display: inline-flex; align-items: baseline; gap: 0.3rem;
         padding: 0.18rem 0.45rem; border: 1px solid var(--rule);
         background: var(--paper); }
  .run .rtool   { font-weight: 700; color: var(--ink); letter-spacing: 0.08em; }
  .run .rstatus { text-transform: uppercase; font-size: 0.58rem;
                  letter-spacing: 0.2em; font-weight: 700; }
  .run .rstatus.success     { color: var(--good); }
  .run .rstatus.partial     { color: var(--high); }
  .run .rstatus.failed      { color: var(--bad); }
  .run .rstatus.skipped     { color: var(--mute); }
  .run .rstatus.in_progress { color: var(--medium); }

  /* FOOTER -------------------------------------------------------------- */
  footer { margin-top: 4rem; padding-top: 1.25rem;
           border-top: 1px solid var(--rule); color: var(--mute);
           font-size: 0.7rem; letter-spacing: 0.12em;
           display: flex; justify-content: space-between; flex-wrap: wrap;
           gap: 0.5rem; }

  /* LOAD ANIMATION ------------------------------------------------------ */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); }
                    to   { opacity: 1; transform: translateY(0); } }
  header, .rule, #across, #programs > *, footer {
    animation: rise 480ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
  }
  header                { animation-delay: 0ms;   }
  .rule                 { animation-delay: 100ms; }
  #across               { animation-delay: 140ms; }
  #programs > *:nth-child(1) { animation-delay: 200ms; }
  #programs > *:nth-child(2) { animation-delay: 260ms; }
  #programs > *:nth-child(3) { animation-delay: 320ms; }
  #programs > *:nth-child(n+4) { animation-delay: 380ms; }
  footer                { animation-delay: 440ms; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="marque">H1 <small>RECON LEDGER</small></div>
      <div class="sub">earn-money · operations dashboard · read-only</div>
    </div>
    <div id="refresh" class="live busy">
      <span class="dot"></span><span class="rlabel">CONNECTING</span>
    </div>
  </header>

  <div class="rule"><span>§ 01 — SUMMARY</span></div>
  <section id="across"></section>

  <div class="rule"><span>§ 02 — PROGRAMS</span></div>
  <section id="programs"></section>

  <footer>
    <span id="updated">awaiting first sync</span>
    <span>polling /api/status every 10s · http://h1.cocode.dk</span>
  </footer>
</main>

<script>
"use strict";
const REFRESH_MS = 10000;
const acrossEl   = document.getElementById("across");
const programsEl = document.getElementById("programs");
const refreshEl  = document.getElementById("refresh");
const rlabelEl   = refreshEl.querySelector(".rlabel");
const updatedEl  = document.getElementById("updated");

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "data") for (const d in attrs.data) e.dataset[d] = attrs.data[d];
    else e.setAttribute(k, attrs[k]);
  }
  if (text !== undefined && text !== null) e.appendChild(document.createTextNode(String(text)));
  return e;
}
function setRefresh(state, label) {
  refreshEl.className = "live " + state;
  rlabelEl.textContent = label;
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toISOString().replace("T", " ").replace(/:\d{2}\.\d+Z$/, "Z");
}
function ageLabel(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso);
  if (isNaN(t)) return iso;
  const secs = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (secs < 60)    return secs + "s ago";
  if (secs < 3600)  return Math.round(secs / 60)   + "m ago";
  if (secs < 86400) return Math.round(secs / 3600) + "h ago";
  return Math.round(secs / 86400) + "d ago";
}

function renderAcross(across) {
  acrossEl.replaceChildren();
  const tile = (label, value, opts = {}) => {
    const node = el("div", { class: "metric" });
    node.appendChild(el("span", { class: "label" }, label));
    const v = el("span", { class: "value" + (opts.class ? " " + opts.class : "") });
    v.appendChild(document.createTextNode(String(value)));
    if (opts.unit) v.appendChild(el("span", { class: "unit" }, opts.unit));
    node.appendChild(v);
    return node;
  };
  acrossEl.appendChild(tile("Total queued",  across.total_queued ?? 0));
  acrossEl.appendChild(tile("Total findings", across.total_findings ?? 0));
  acrossEl.appendChild(tile(
    "Suppression",
    Math.round((across.suppression_rate_pct ?? 0) * 10) / 10,
    { unit: "%" }
  ));
  const firstOk = !!across.first_verified_with_operator_note;
  acrossEl.appendChild(tile(
    "First verified",
    firstOk ? "✓" : "✗",
    { class: firstOk ? "good" : "bad" }
  ));
}

function renderPolicy(p) {
  return el("span", { class: "policy " + (p.policy || "unknown") }, p.policy || "unknown");
}

function renderStates(states) {
  const row = el("div", { class: "states" });
  for (const name in states) {
    const n = states[name] || 0;
    if (n <= 0) continue;
    const s = el("span", { class: "state " + name });
    s.appendChild(el("span", { class: "name" }, name.replace(/_/g, " ")));
    s.appendChild(el("span", { class: "n" }, n));
    row.appendChild(s);
  }
  if (!row.childNodes.length) row.appendChild(el("span", { class: "empty" }, "no findings yet"));
  return row;
}

function renderQueueTable(top) {
  if (!top || !top.length) return el("div", { class: "empty" }, "no queued candidates");
  const t = el("table", { class: "qtbl" });
  const head = el("thead");
  const hr = el("tr");
  ["hash", "sev", "class", "asset", "first seen"].forEach(h => hr.appendChild(el("th", null, h)));
  head.appendChild(hr); t.appendChild(head);
  const body = el("tbody");
  for (const r of top) {
    const tr = el("tr");
    tr.appendChild(el("td", { class: "hash" }, (r.hash || "").slice(0, 8)));
    const sevTd = el("td"); sevTd.appendChild(
      el("span", { class: "sev " + (r.severity || "unknown") }, r.severity || "unknown")
    ); tr.appendChild(sevTd);
    tr.appendChild(el("td", { class: "vc" }, r.vuln_class || ""));
    tr.appendChild(el("td", { class: "asset" }, r.asset || ""));
    tr.appendChild(el("td", { class: "ts" }, ageLabel(r.first_seen)));
    body.appendChild(tr);
  }
  t.appendChild(body);
  return t;
}

function renderRunsStrip(runs) {
  if (!runs || !runs.length) return el("div", { class: "empty" }, "no recent runs");
  const strip = el("div", { class: "runs" });
  for (const r of runs) {
    const chip = el("span", { class: "run" });
    chip.appendChild(el("span", { class: "rtool" }, r.tool || "?"));
    chip.appendChild(el("span", { class: "rstatus " + (r.status || "unknown") }, r.status || "?"));
    chip.appendChild(document.createTextNode("· " + ((r.signal_count || 0) + " sigs")));
    strip.appendChild(chip);
  }
  return strip;
}

function renderPrograms(programs) {
  programsEl.replaceChildren();
  if (!programs.length) {
    programsEl.appendChild(el("div", { class: "empty" }, "no programs registered"));
    return;
  }
  let idx = 0;
  for (const p of programs) {
    idx += 1;
    const a = el("article", { class: "program", data: { index: String(idx).padStart(2, "0") } });

    const head = el("div", { class: "prog-head" });
    const title = el("span", { class: "prog-title" });
    title.appendChild(el("span", { class: "platform" }, p.platform || "?"));
    title.appendChild(el("span", { class: "sep" }, "/"));
    title.appendChild(el("span", { class: "slug" }, p.slug || "?"));
    head.appendChild(title);
    head.appendChild(renderPolicy(p));
    head.appendChild(el("span", { class: "prog-synced" }, "synced " + ageLabel(p.last_synced)));
    a.appendChild(head);

    if (p.frozen) {
      a.appendChild(el("div", { class: "frozen-row" }, "FROZEN: " + (p.frozen_reason || "no reason recorded")));
    }
    if (p.error) {
      a.appendChild(el("div", { class: "error-row" }, "ERROR: " + p.error));
    }

    a.appendChild(renderStates(p.finding_states || {}));
    a.appendChild(renderQueueTable(p.top_queue || []));
    a.appendChild(renderRunsStrip(p.recent_runs || []));

    programsEl.appendChild(a);
  }
}

async function tick() {
  setRefresh("busy", "FETCHING");
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    renderAcross(data.across || {});
    renderPrograms(data.programs || []);
    const generated = data.generated_at ? fmtTime(data.generated_at) : "—";
    updatedEl.textContent = "last sync " + generated;
    setRefresh("live", "LIVE");
  } catch (e) {
    setRefresh("stale", "STALE");
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
