<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earn-money dashboard</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/dashboard.css">
<link rel="stylesheet" href="/static/panels.css">
<link rel="stylesheet" href="/static/probe.css">
<link rel="stylesheet" href="/static/probe-detail.css">
</head>
<body>
<main>
  <header>
    <div class="brand">
      <h1 class="marque">H1 <small>RECON LEDGER</small></h1>
      <div class="sub">earn-money · operations dashboard · read-only</div>
    </div>
    <a id="active-probe-pill" class="probe-pill" hidden href="#tab=probe">
      <span class="pill-dot" aria-hidden="true"></span>
      <span class="pill-label">PROBE</span>
      <span class="pill-target"></span>
      <span class="pill-turn"></span>
    </a>
    <div id="refresh" class="live busy" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span class="rlabel">CONNECTING</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="recon" role="tab" aria-selected="true">RECON</button>
    <button class="tab"        data-tab="probe" role="tab" aria-selected="false">PROBE</button>
  </nav>

  <div id="tab-recon" role="tabpanel">
    <h2 class="rule"><span>§ 01 — SUMMARY</span></h2>
  <section id="across" aria-label="across-program summary"></section>

  <h2 class="rule"><span>§ 02 — ACTIVE SCANS</span></h2>
  <section id="active-runs" aria-label="runs in flight"></section>

  <h2 class="rule"><span>§ 03 — RECENT SIGNALS</span></h2>
  <section id="recent-signals" aria-label="latest signals across programs"></section>

  <h2 class="rule"><span>§ 04 — PROGRAMS</span></h2>
  <section id="programs" aria-label="per-program status"></section>
  </div>

  <div id="tab-probe" role="tabpanel" hidden>
    <h2 class="rule"><span>§ 01 — PROBE LAUNCHER</span></h2>
    <section id="probe-launcher">
      <form id="probe-form" autocomplete="off">
        <label>Base URL <input name="base_url" type="url" required></label>
        <label>Target kind
          <select name="target_kind" required>
            <option value="local_lab" selected>Local lab</option>
            <option value="registered_program">Registered program</option>
          </select>
          <small class="hint">Local lab: program optional, FROZEN check skipped. Registered program: program required, FROZEN check enforced.</small>
        </label>
        <label>RoE profile <input name="roe_profile" type="text" placeholder="roe/local-lab.yaml"></label>
        <label>Max turns <input name="max_turns" type="number" min="1" max="10000" value="10"></label>
        <label>Platform <input name="platform" type="text" placeholder="local"></label>
        <label>Program
          <input name="program" type="text" placeholder="(required when target_kind=registered_program)">
          <small class="hint">Required when target_kind is "Registered program" so the FROZEN gate fires; may be empty when target_kind is "Local lab".</small>
        </label>
        <button type="submit" id="probe-run">RUN</button>
      </form>
    </section>

    <h2 class="rule"><span>§ 02 — LIVE TIMELINE</span></h2>
    <div class="probe-body">
      <section id="probe-timeline" aria-live="polite"></section>
      <aside id="probe-detail" aria-label="prompt & response detail"></aside>
    </div>
  </div>

  <footer>
    <span id="updated">awaiting first sync</span>
    <span>http://h1.cocode.dk</span>
  </footer>
</main>
<script src="/static/render.js"></script>
<script src="/static/render_panels.js"></script>
<script src="/static/dashboard.js"></script>
<script src="/static/tabs.js"></script>
<script src="/static/probe-status.js"></script>
<script src="/static/probe-state.js"></script>
<script src="/static/probe-render.js"></script>
<script src="/static/probe-detail.js"></script>
<script src="/static/probe.js"></script>
<script src="/static/probe-pill.js"></script>
</body>
</html>
