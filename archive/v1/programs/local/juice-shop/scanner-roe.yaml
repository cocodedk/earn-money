# Scanner RoE profile — local/juice-shop
#
# target.cocode.dk is the operator's own OWASP Juice Shop instance,
# stood up specifically as a PoC playground for the engine. There are
# no real users, no third-party assets, no production data. The
# operator authorizes ALL HTTP techniques on this target — RoE here
# does NOT restrict the engine.
#
# Mirrors the technique-level authorization in `roe.md`.
#
# Submit via the dashboard form's "RoE profile" field as:
#   programs/local/juice-shop/scanner-roe.yaml
#
# Do NOT use this profile against any host other than target.cocode.dk
# (allowed_hosts gates that). Do NOT change `safe_default` to match —
# safe_default stays the conservative floor for unknown targets.

name: juice-shop-local-lab
allowed_hosts:
  - target.cocode.dk

# Effectively unbounded budgets — the LLM's own decision-making is the
# real ceiling. Numbers are large but finite so a runaway loop still
# eventually terminates rather than burning indefinitely.
max_turns: 10000
max_requests: 100000
max_posts: 100000
max_response_bytes: 200000
max_runtime_seconds: 86400
delay_between_requests_ms: 0

# All HTTP methods.
allow_get: true
allow_post: true
allow_put: true
allow_patch: true
allow_delete: true

# All technique gates flipped on. Each maps to a category in
# RoePolicy._GATED — flipping all to True makes the policy permit every
# known action category against this target.
allow_authenticated_testing: true
allow_rate_limit_testing: true
allow_bruteforce: true
allow_password_spraying: true
allow_credential_stuffing: true
allow_exploit_chains: true
allow_destructive_actions: true
allow_file_upload_tests: true
allow_graphql_introspection: true
allow_openapi_probing: true
allow_idor_checks: true
allow_xss_probe_payloads: true
allow_sqli_probe_payloads: true
allow_sensitive_data_capture: true
