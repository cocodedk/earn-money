# pytest + coverage configuration for the scanner backend.
# Strict-TDD rule (CLAUDE.md §Engineering principles → TDD): 100% line
# + branch coverage on apps/. CI refuses anything below.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=apps",
    "--cov=config",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/apps.py",
    "*/admin.py",
    "*/__init__.py",
    # Django/Celery boilerplate — no test value
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings.py",
    "config/urls.py",
    "config/celery.py",
    # Opt-in live-network tests — skipped unless LIVE_TESTS=1. Counting
    # them against the strict-coverage bar would force every CI run to
    # require external connectivity to target.cocode.dk.
    "*/test_live_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
