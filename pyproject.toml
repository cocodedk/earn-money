[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earn_money"
version = "0.0.1"
description = "Bug-bounty operations pipeline."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "tldextract>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
# Pick the LLM extras for whichever provider(s) the operator wants
# active. `agent-all` pulls every adapter at once.
agent-anthropic = ["anthropic>=0.43"]
agent-openai = ["openai>=1.50"]
agent-all = ["anthropic>=0.43", "openai>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true
